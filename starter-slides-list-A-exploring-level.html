        /* Float four columns side by side */
        .column {
            float: left;
            padding: 10px 10px;
            width: 25%;

            content: "";
            display: table;
            clear: both;
        }

        /* Responsive columns */

            .column {
                width: 100%;
                display: block;
                margin-bottom: 20px;

        a {
