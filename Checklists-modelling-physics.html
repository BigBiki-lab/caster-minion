<script>
    let slideIndex = 1;
    showSlides(slideIndex);

    function plusSlides(n) {
      showSlides(slideIndex += n);
    }

    function currentSlide(n) {
      showSlides(slideIndex = n);
    }

    function showSlides(n) {
      let i;
      let slides = document.getElementsByClassName("mySlides");
      let dots = document.getElementsByClassName("demo");
      let captionText = document.getElementById("caption");
      if (n > slides.length) {slideIndex = 1}
      if (n < 1) {slideIndex = slides.length}
      for (i = 0; i < slides.length; i++) {
        slides[i].style.display = "none";
      }
      for (i = 0; i < dots.length; i++) {
        dots[i].className = dots[i].className.replace(" active", "");
      }
      slides[slideIndex-1].style.display = "block";
      dots[slideIndex-1].className += " active";
      captionText.innerHTML = dots[slideIndex-1].alt;
    }
</script>
<script>
    function openCity(evt, cityName) {

      tabcontent = document.getElementsByClassName("tabcontent");
      for (i = 0; i < tabcontent.length; i++) {

<script>
    const checkboxes = document.querySelectorAll('input[type="checkbox"]');

    // Load saved states
    checkboxes.forEach(checkbox => {
        const savedState = localStorage.getItem(checkbox.id);

        if (savedState === 'true') {
            checkbox.checked = true;
        }

        // Save state when changed
        checkbox.addEventListener('change', () => {
            localStorage.setItem(checkbox.id, checkbox.checked);
        });
    });
</script>

<script>
    function updateOverallProgress() {

        // Find every checkbox in all 7 slides
        const checkboxes = document.querySelectorAll(".progress-item");

        // Count checked boxes
        const checked = document.querySelectorAll(".progress-item:checked").length;

        // Total number of boxes
        const total = checkboxes.length;

        // Calculate percentage
        let percentage = 0;

        if (total > 0) {
            percentage = Math.round((checked / total) * 100);
        }

        // Display percentage
        document.getElementById("overallPercentage").textContent =
            percentage + "%";
    }


    // Update percentage whenever a checkbox is ticked/unticked
    document.addEventListener("change", function(event) {

        if (event.target.classList.contains("progress-item")) {
            updateOverallProgress();
        }

    });


    // Set initial percentage
    updateOverallProgress();
</script>
